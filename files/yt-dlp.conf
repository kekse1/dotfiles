# speicherort und dateiname
-o ~/YouTube/download/%(title)s [%(id)s].%(ext)s

# best quality
-f "bv*+ba/b"
--merge-output-format mkv
--video-multistreams
--audio-multistreams
--prefer-free-formats
#??
--check-formats
--check-all-formats

# metadaten und kapitel einbetten
--embed-thumbnail
--embed-metadata
--embed-chapters
--embed-subs
--sub-langs "de,en"

# progress bar..
--progress
--print-traffic

# ...
--live-from-start
--download-archive ~/YouTube/archiv
--break-on-existing

# really?
--no-playlist

#
--no-restrict-filenames
--trim-filenames 192
--continue

--write-thumbnail
--write-all-thumbnails
--write-description
--write-info-json
--write-playlist-metafiles
--no-clean-info-json
--write-subs
--write-auto-subs

#???
--write-comments

#
--cache-dir ~/YouTube/cache/

