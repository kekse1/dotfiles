#
set -g history-limit 16384
# mag ich lieber (off), um in terminals text "besser" zu markieren, etc.
# andererseits... das scroll-whell! .. daher jetzt doch (on) by default.
set -g mouse on



# extra fuer TERMUX Linux! :-)
# MAYBE you'd like to remove/replace the /bin/bash (don't forget the trailing `\`)?
if-shell '[ -d /data/data/com.termux/ ]' \
	'set -g default-shell /data/data/com.termux/files/usr/bin/bash' \
	'set -g default-shell /bin/bash'



#try it out?
#set -g default-terminal 'tmux-256color'
#set -g default-terminal 'screen-256color'




#
setw -g automatic-rename
set -g status-interval 1



# status-leiste, beautified!
set -g status-bg '#4e4e4e'
set -g status-fg '#ffffff'
set -g status-left-length 50
set -g status-left '#[fg=#88ff00,bg=#1c1c1c] #S #[default]'
set -g status-right '#[fg=#00d0ff]#H#[default] #[bg=#2e2e2e,fg=#ffb300] #(cut -d " " -f -3 /proc/loadavg) #[fg=#d0ff00,bg=#1c1c1c] %H:%M:%S '
set -g window-status-format ' [#I] #W '
set -g window-status-current-format ' [#I] #W '
set -g window-status-current-style bg='#55ff55',fg='#000000'






# window/pane colors
#root-user: #32001e
#root-group: #1e0028
# following will adjust colors depending on root user/group.
if-shell '[ `id -u` -eq 0 ]' \
	'set -g window-active-style bg="#32001e",fg=brightwhite' \
	'if-shell "[ `id -g` -eq 0 ]" \
		"set -g window-active-style bg=\"#1e0028\",fg=brightwhite" \
			"set -g window-active-style bg=black,fg=default"'
#replaced by above 'if-shell'...
#set -g window-active-style bg=black,fg=brightwhite
set -g window-style bg="#0a1e28",fg=brightwhite


# panes border-colors
set -g pane-active-border-style fg='brightyellow'
set -g pane-border-style fg='brightwhite'




# standard-verzeichnis 4 neue fenstale besetzen mit `pwd`/$PWD. ..
bind-key ! attach-session -c "#{pane_current_path}"



# rename window/session
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"



# move windows (in their order)
bind-key -n S-Left swap-window -t -1\; select-window -t -1
bind-key -n S-Right swap-window -t +1\; select-window -t +1
bind-key -n M-Left previous-window
bind-key -n M-Right next-window




# my "easier" pane splitting: 'h'orizontal, 'v'ertikal
bind-key h split-window -h
bind-key v split-window -v

# switch between PANEs: <alt>+<Shift>+<Up/Left/Down/Right>.
bind-key -n M-S-Up select-pane -U
bind-key -n M-S-Left select-pane -L
bind-key -n M-S-Down select-pane -D
bind-key -n M-S-Right select-pane -R

# resize PANEs: <alt>+<shift>+<w/a/s/d> (like in ego games ;-)
bind-key -n M-W resize-pane -U 4
bind-key -n M-A resize-pane -L 4
bind-key -n M-S resize-pane -D 4
bind-key -n M-D resize-pane -R 4

# swap current pane with last selected one
bind-key s swap-pane -s '!' -t $TMUX_PANE







# '#' like in my termux linux @ phone.
bind-key '#' new-window

#
bind-key d detach

#
bind-key k confirm-before -p "KILL window #W (y/n)?" kill-window

# das ist (hier) sinnvoll fuer mich, um x-fenstale aufmachen zu koennen (fehlt noch ein external script?);
set -g update-environment "DISPLAY" # `export DISPLAY=:0.0` ...

#
#that's all. atm.
#
